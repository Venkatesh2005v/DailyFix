spring.application.name=dailyfix

# --- Database (Supabase) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# --- Server & Proxy Settings (CRITICAL for Render) ---
# Tells Spring to trust Render's HTTPS headers
server.forward-headers-strategy=native
server.port=${PORT:8080}



# --- OAuth2 Configuration ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/gmail.modify,https://www.googleapis.com/auth/gmail.send

# This must match Google Cloud Console: https://dailyfix-ld2d.onrender.com/login/oauth2/code/google
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
jwt.secret=${JWT_SECRET}
# Remove or comment out session/cookie config ? not needed anymore
# --- API Keys ---
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent